version: "3.9"

services:

  backend:
    build: .
    container_name: ai_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_db

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: