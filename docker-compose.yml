version: "3.9"

services:

  backend:
    build: .
    container_name: ai_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - QUEUE_BACKEND=arq
    depends_on:
      - qdrant
      - postgres
      - redis

  worker:
    build: .
    container_name: ai_worker
    command: ["arq", "services.job_queue.WorkerSettings"]
    env_file:
      - .env
    environment:
      - QUEUE_BACKEND=arq
    depends_on:
      - redis
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    container_name: memory_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_db

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: memory_cache
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    container_name: ai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
  pgdata:
